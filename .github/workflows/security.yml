name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Look for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --redact --verbose --no-banner

  images:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build bastion/Dockerfile
        run: docker build -t scan-target-0 bastion

      - name: Scan bastion/Dockerfile for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target-0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build app/Dockerfile
        run: docker build -t scan-target-1 app

      - name: Scan app/Dockerfile for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target-1
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Scan the compose files for misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
