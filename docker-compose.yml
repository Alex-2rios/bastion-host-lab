name: bastion-host-lab

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bastion:
    <<: *hardening
    build: ./bastion
    container_name: lab-bastion
    hostname: bastion
    ports:
      - "2222:22"
    volumes:
      - ./ssh:/keys:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
      - AUDIT_WRITE
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      dmz:
        ipv4_address: 172.30.10.10
      internal:
        ipv4_address: 172.30.20.10
    restart: unless-stopped

  app:
    <<: *hardening
    build: ./app
    container_name: lab-app
    hostname: app01
    volumes:
      - ./ssh:/keys:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SYS_CHROOT
      - AUDIT_WRITE
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      internal:
        ipv4_address: 172.30.20.20
    depends_on:
      - db
    restart: unless-stopped

  db:
    <<: *hardening
    image: mysql:8.0
    container_name: lab-db
    hostname: db01
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootlab}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: inventory
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-applab}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      internal:
        ipv4_address: 172.30.20.30
    restart: unless-stopped

networks:
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  db_data:
