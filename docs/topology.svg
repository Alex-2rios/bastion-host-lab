<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="28" y="40" font-size="20" font-weight="600" fill="#111827">bastion-host-lab — one way in, nothing else exposed</text>

  <rect x="24" y="70" width="196" height="360" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="122" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#b91c1c">untrusted</text>

  <rect x="244" y="70" width="196" height="360" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="342" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#b45309">dmz 172.30.10.0/24</text>

  <rect x="464" y="70" width="412" height="360" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="670" y="94" font-size="12" font-weight="600" text-anchor="middle" fill="#15803d">internal 172.30.20.0/24 (no route out)</text>

  <rect x="52" y="200" width="140" height="80" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="122" y="232" font-size="14" font-weight="600" text-anchor="middle" fill="#111827">workstation</text>
  <text x="122" y="252" font-size="11" text-anchor="middle" fill="#6b7280">holds the private key</text>

  <rect x="272" y="190" width="140" height="100" rx="8" fill="#ffffff" stroke="#d97706"/>
  <text x="342" y="220" font-size="14" font-weight="600" text-anchor="middle" fill="#78350f">bastion</text>
  <text x="342" y="240" font-size="11" text-anchor="middle" fill="#92400e">172.30.10.10</text>
  <text x="342" y="256" font-size="11" text-anchor="middle" fill="#92400e">172.30.20.10</text>
  <text x="342" y="276" font-size="11" text-anchor="middle" fill="#b45309">key auth only</text>

  <rect x="520" y="130" width="150" height="86" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="595" y="162" font-size="14" font-weight="600" text-anchor="middle" fill="#14532d">app01</text>
  <text x="595" y="182" font-size="11" text-anchor="middle" fill="#15803d">172.30.20.20</text>
  <text x="595" y="200" font-size="11" text-anchor="middle" fill="#15803d">ssh from bastion only</text>

  <rect x="520" y="284" width="150" height="86" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="595" y="316" font-size="14" font-weight="600" text-anchor="middle" fill="#14532d">db01</text>
  <text x="595" y="336" font-size="11" text-anchor="middle" fill="#15803d">172.30.20.30</text>
  <text x="595" y="354" font-size="11" text-anchor="middle" fill="#15803d">mysql, no published port</text>

  <rect x="700" y="150" width="160" height="200" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="716" y="176" font-size="12" font-weight="600" fill="#374151">layers in play</text>
  <text x="716" y="200" font-size="11" fill="#4b5563">1. internal docker net</text>
  <text x="716" y="220" font-size="11" fill="#4b5563">2. UFW per host role</text>
  <text x="716" y="240" font-size="11" fill="#4b5563">3. sshd: pubkey only,</text>
  <text x="726" y="256" font-size="11" fill="#4b5563">no root, AllowUsers</text>
  <text x="716" y="276" font-size="11" fill="#4b5563">4. mysql grants bound</text>
  <text x="726" y="292" font-size="11" fill="#4b5563">to the internal subnet</text>
  <text x="716" y="316" font-size="11" fill="#4b5563">any one of them can</text>
  <text x="716" y="332" font-size="11" fill="#4b5563">fail without exposing</text>
  <text x="716" y="348" font-size="11" fill="#4b5563">the database</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/>
    </marker>
  </defs>

  <line x1="192" y1="240" x2="266" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="229" y="230" font-size="10" text-anchor="middle" fill="#334155">ssh :2222</text>

  <line x1="412" y1="215" x2="514" y2="176" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="463" y="186" font-size="10" text-anchor="middle" fill="#334155">ProxyJump</text>

  <line x1="412" y1="266" x2="514" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="463" y="308" font-size="10" text-anchor="middle" fill="#334155">-L tunnel</text>

  <line x1="595" y1="216" x2="595" y2="278" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="640" y="252" font-size="10" text-anchor="middle" fill="#334155">3306</text>

  <line x1="122" y1="200" x2="122" y2="150" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="106" y1="166" x2="138" y2="134" stroke="#b91c1c" stroke-width="2"/>
  <line x1="106" y1="134" x2="138" y2="166" stroke="#b91c1c" stroke-width="2"/>
  <text x="122" y="122" font-size="10" text-anchor="middle" fill="#b91c1c">direct to db: denied</text>
</svg>
